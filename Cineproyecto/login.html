<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport
        content="width=device-width, initial-scale=1.0">
    <title>Cinema Pro | Login</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="background"></div>
    <main class="container">
        <!-- PANEL IZQUIERDO -->
        <section class="branding">
            <span class="tag">
                SISTEMA EJECUTIVO
            </span>
            <h1>
                CINEMA PRO
            </h1>
            <p>
                Plataforma de administración para la gestió
                operativa, financiera y estratégica del cine.
            </p>
            <div class="info-box">
                <h3>
                    Estado del sistema
                </h3>
                <p>
                    🟢 Todos los servicios operativos
                </p>
            </div>
        </section>
        <!-- PANEL DERECHO -->
        <section class="login-panel">
            <h2>
                Iniciar sesión
            </h2>
            <p>
                Accede a tu panel administrativo.
            </p>
            <form>
                <div class="input-group">
                    <label>
                        Correo electrónico
                    </label>
                    <inpu
                        type="email
                        placeholder="correo@empresa.com">
                </div>
                <div class="input-group">
                    <label>
                        Contraseña
                    </label>
                    <inpu
                        type="password
                        placeholder="••••••••">
                </div>
                <div class="options">
                    <label>
                        <input type="checkbox">
                        Recordarme
                    </label>
                    <a href="#">
                        Recuperar contraseña
                    </a>
                </div>
                <button>
                    Iniciar sesión
                </button>
            </form>
            <div class="footer">
                Cinema Pro · Versión 1.0
            </div>
        </section>
    </main>
</body>
</html>
